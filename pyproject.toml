[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-bargain"
dynamic = ["version"]
description = "Price tracker and discovery bot — finds the lowest price across multiple search engines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",  # NoDecode (comma-separated ALERT_RECIPIENTS)
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.11.0,<4.0.0",  # 3.10 imports pkg_resources, which setuptools has dropped
    "google-search-results>=2.4.0",
    "click>=8.1.0",
]

[project.scripts]
hb = "hunter_bargain.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx2>=2.0.0",  # the HTTP client Starlette's TestClient is built on; not imported directly
    "ruff>=0.8.0",
    "mypy>=2.4",
    "pre-commit>=4.6",
]

[tool.hatch.version]
# The only copy of the version: the package metadata and the API docs read it from here.
path = "src/hunter_bargain/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["serpapi", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
