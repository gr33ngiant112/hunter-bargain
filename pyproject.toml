[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter-bargain"
dynamic = ["version"]
description = "Price tracker and discovery bot — finds the lowest price across multiple search engines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.133.0",  # 0.132 keeps Starlette below 1.0; Starlette 0.52.1 has known advisories
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.16",  # 2.0.15 calls datetime.utcfromtimestamp(), deprecated in Python 3.12
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",  # NoDecode (comma-separated ALERT_RECIPIENTS)
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.11.0,<4.0.0",  # 3.10 imports pkg_resources, which setuptools has dropped
    "google-search-results>=2.4.0",
    "click>=8.1.0",
]

[project.scripts]
hb = "hunter_bargain.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # 9.0.3 fixes PYSEC-2026-1845
    "pytest-cov>=5.0.0",
    "httpx2>=2.12.0",  # Starlette's TestClient runs on it (not imported); 2.12.0 fixes its advisories
    "ruff>=0.8.0",
    "mypy>=2.4",
    "pre-commit>=4.6",
]

[tool.hatch.version]
# The only copy of the version: the package metadata and the API docs read it from here.
path = "src/hunter_bargain/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["serpapi", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning fails the test that raised it: deprecations and unclosed resources surface in CI.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["hunter_bargain"]

[tool.coverage.report]
fail_under = 85
# The gate compares the total at this precision: with the default 0, 84.6% rounds up and passes.
precision = 2
show_missing = true
