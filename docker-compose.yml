services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunter-bargain-app
    ports:
      # Loopback only: reach the API from this host, or put a reverse proxy with auth in front for LAN use.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite database across container restarts
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
    driver: local
