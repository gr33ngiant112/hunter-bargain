# Alembic settings for developers and CI, run from the repo root: `alembic upgrade head`,
# `alembic check`, `alembic revision --autogenerate -m "..."`. The database is DATABASE_URL,
# as for the app. The app does not read this file: it migrates at startup (db.init_db).

[alembic]
script_location = %(here)s/src/hunter_bargain/migrations
path_separator = os

# Logging for the alembic command only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
