# The local gate for every commit, whichever editor or agent makes it. Once per clone:
#   uv sync --locked --extra dev && source .venv/bin/activate && pre-commit install
# Hook revisions are frozen to commit SHAs; `pre-commit autoupdate --freeze` moves them.
# `pre-commit install` installs both git hooks below; the file checks run before each commit,
# and the commit-message check runs on each message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: detect-private-key
  - repo: local
    hooks:
      # The venv's mypy, so it sees the project's dependencies; it checks src (pyproject.toml).
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      # CONTRIBUTING.md "Commit Messages": a type from its list, an optional (scope) and `!`, then
      # ": " and the summary. Git's own merge, revert, fixup!, squash! and amend! messages pass.
      # CI runs this hook on every commit a pull request adds.
      - id: commit-message
        name: commit message
        language: pygrep
        entry: '\A(?:(?:feat|fix|refactor|docs|test|chore|ci)(?:\([\w./-]+\))?!?: \S|Merge |Revert "|(?:fixup|squash|amend)! )'
        args: [--multiline, --negate]
        stages: [commit-msg]
