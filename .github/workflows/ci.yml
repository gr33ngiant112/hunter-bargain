name: CI

on:
  # Draft PRs skip every job (the `if` on each); marking a PR ready for review runs CI. A push
  # has no pull_request, and null == false is true in Actions expressions, so pushes run every job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Each push to develop gets a group of
# its own (its commit), so a develop run is never cancelled or dropped while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The app image as Docker Compose builds it, and the checks inside the Dockerfile's test stage:
  # lint, types, the tests with the coverage gate, and migrations. Then the app image must answer
  # /health, and trivy scans it.
  test:
    name: test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The name of everything this run creates: the Compose project, its images and containers.
      CI_NAME: ci-hunter-bargain-${{ github.run_id }}-${{ github.run_attempt }}
      # Compose loads the app's env_file (HB_ENV_FILE, default .env) with the project, and a
      # checkout has no .env: the committed example (development values, no credentials) stands
      # in. The images do not contain it, and no step starts the app with it.
      HB_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image the app deploys, built as `docker compose build` builds it: $CI_NAME-app.
      - name: Build the app image
        run: docker compose -p "$CI_NAME" build
      # The app's packages from uv.lock, plus the dev tools and the tests. The build fails when
      # uv.lock is out of date with pyproject.toml.
      - name: Build the test image
        run: docker build --target test -t "$CI_NAME-test" .
      - name: Lint
        run: docker run --rm "$CI_NAME-test" sh -c 'ruff check . && ruff format --check .'
      # The files to check (src) are set in pyproject.toml, as for the pre-commit hook.
      - name: Type check
        run: docker run --rm "$CI_NAME-test" mypy
      # Branch coverage of the package (pyproject.toml): under 85% fails the job.
      - name: Test
        run: docker run --rm "$CI_NAME-test" pytest -q --cov
      # An empty database migrates to head, and the models match it: no migration is missing.
      - name: Migrations
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:////tmp/migrations.db "$CI_NAME-test"
          sh -c 'alembic upgrade head && alembic check'
      # The app image with no settings (the defaults: no credentials, an empty database), on a
      # port of 127.0.0.1 that Docker picks. /health must answer within 60 seconds.
      - name: Smoke test the app image
        run: |
          docker run --detach --name "$CI_NAME-smoke" --publish 127.0.0.1::8000 "$CI_NAME-app"
          address=$(docker port "$CI_NAME-smoke" 8000/tcp)
          for _ in $(seq 60); do
            curl -fs --max-time 2 "http://$address/health" | grep -Fx '{"status":"ok"}' && exit 0
            sleep 1
          done
          docker logs "$CI_NAME-smoke"
          echo "::error::The app image did not answer /health within 60 seconds"
          exit 1
      - name: Install trivy 0.75.0 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      # A HIGH or CRITICAL vulnerability with a fix available, in the image's Debian or Python
      # packages, fails the job.
      - name: Scan the app image with trivy
        run: >-
          "$RUNNER_TEMP/trivy" image --no-progress --ignore-unfixed --severity HIGH,CRITICAL
          --exit-code 1 "$CI_NAME-app"
      - name: Remove the containers and images
        if: always()
        run: |
          docker rm --force "$CI_NAME-smoke"
          docker compose -p "$CI_NAME" down --volumes --remove-orphans
          docker image rm --force "$CI_NAME-app" "$CI_NAME-test"

  # The lowest versions pyproject.toml allows for each direct dependency, not uv.lock, so the
  # declared floors stay installable and tested: the Dockerfile's test-lowest-direct stage.
  test-lowest-direct:
    name: test-lowest-direct
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_NAME: ci-hunter-bargain-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test image with the lowest direct versions
        run: docker build --target test-lowest-direct -t "$CI_NAME-lowest-direct" .
      # With coverage, as in the test job, so the pytest-cov floor is tested too.
      - name: Test
        run: docker run --rm "$CI_NAME-lowest-direct" pytest -q --cov
      - name: Remove the image
        if: always()
        run: docker image rm --force "$CI_NAME-lowest-direct"

  # The tests with the uv.lock versions on the newer Pythons requires-python allows: the
  # Dockerfile's test stage, with python:3.13-slim or python:3.14-slim as its base stage.
  test-python:
    name: test-python-${{ matrix.python }}
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      CI_NAME: ci-hunter-bargain-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test image on Python ${{ matrix.python }}
        run: >-
          docker build --target test --build-context "base=docker-image://python:$PYTHON-slim"
          -t "$CI_NAME-test-python-$PYTHON" .
      # Fails when the image runs another Python, e.g. after a rename of the base stage.
      - name: Check the Python version
        run: docker run --rm "$CI_NAME-test-python-$PYTHON" python --version | grep -F "Python $PYTHON."
      - name: Test
        run: docker run --rm "$CI_NAME-test-python-$PYTHON" pytest -q --cov
      - name: Remove the image
        if: always()
        run: docker image rm --force "$CI_NAME-test-python-$PYTHON"

  secret-scan:
    name: secret-scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the full history behind HEAD
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from HEAD (on a PR, GitHub's merge commit), so no commit
      # range or PR size can leave commits out. --diff-merges=first-parent also scans what each
      # merge commit changes (git log -p skips merge diffs by default). --redact keeps values
      # out of the log.
      - name: Scan the full history with gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--diff-merges=first-parent HEAD" .'

  # Every commit a pull request adds, merges aside, must pass the commit-message hook in
  # .pre-commit-config.yaml (CONTRIBUTING.md "Commit Messages"). Pull requests only: a push has
  # no pull request's commits to check.
  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request's commits and its base
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Check each commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! pre-commit run commit-message --hook-stage commit-msg \
                --commit-msg-filename "$RUNNER_TEMP/message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done
          exit "$failed"

  dependency-scan:
    name: dependency-scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every locked version, dev tools included; a known vulnerability fails the job.
      - name: Scan uv.lock with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=uv.lock

  # Semgrep's registry rules for Python and FastAPI; a finding fails the job. The official image
  # (Semgrep 1.180.0), pinned by digest, reads the checkout through a read-only mount.
  semgrep:
    name: semgrep
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan with semgrep (p/python, p/fastapi)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --config p/python --config p/fastapi --error --metrics=off

  # The workflows themselves: zizmor audits them for security problems, actionlint for mistakes,
  # including each run script (through the runner image's shellcheck). A finding fails the job.
  workflow-lint:
    name: workflow-lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.30.1 and actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      # The job's token (contents: read) turns on zizmor's online audits, e.g. that each pinned SHA
      # is a commit of the action's own repository and has no known advisory.
      - name: Audit the workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" .github/workflows'
      # Without shellcheck on PATH, actionlint would skip the run scripts silently.
      - name: Lint the workflows with actionlint
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint"
