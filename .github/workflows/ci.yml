name: CI

on:
  # Draft PRs skip every job (the `if` on each); marking a PR ready for review runs CI. A push
  # has no pull_request, and null == false is true in Actions expressions, so pushes run every job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Each push to develop gets a group of
# its own (its commit), so a develop run is never cancelled or dropped while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      # An empty database migrates to head, and the models match it: no migration is missing.
      - name: Migrations
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations.db
        run: |
          alembic upgrade head
          alembic check
      - name: Build
        run: uv build

  secret-scan:
    name: secret-scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the full history behind HEAD
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from HEAD (on a PR, GitHub's merge commit), so no commit
      # range or PR size can leave commits out. --diff-merges=first-parent also scans what each
      # merge commit changes (git log -p skips merge diffs by default). --redact keeps values
      # out of the log.
      - name: Scan the full history with gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--diff-merges=first-parent HEAD" .'

  dependency-scan:
    name: dependency-scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # No lockfile yet (#7): scan what pyproject.toml resolves to today.
      - name: Resolve dependencies
        run: uv pip compile pyproject.toml --all-extras --python-version 3.12 -o requirements-ci.txt
      # Report-only until the lockfile work in #7 lands; then scan uv.lock and drop continue-on-error.
      - name: Scan with osv-scanner (report-only)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=requirements.txt:requirements-ci.txt
